[project]
site_name = "Bluecurve"
site_description = "Bluecurve for NixOS & Home Manager"
site_url = "https://docs.rtin.foo/bluecurve.nix/"
repo_url = "https://github.com/haegrr/bluecurve.nix"
repo_name = "haegrr/bluecurve.nix"
docs_dir = "content"
extra_css = ["stylesheets/bluecurve.css"]
nav = [
  { "Home" = "index.md" },
  { "Home Manager" = [
    "home-manager/index.md",
    { "Options" = "options.md" },
  ] },
  { "NixOS" = [
    "nixos/index.md",
    { "Options" = "nixos-options.md" },
  ] },
]

[project.theme]
custom_dir = "overrides"
variant = "classic"
font = false
features = ["navigation.expand", "navigation.indexes", "navigation.top", "search.highlight", "content.code.copy"]

[project.theme.palette]
scheme = "default"
primary = "custom"
accent = "custom"

[project.markdown_extensions.attr_list]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.toc]
permalink = true

[project.extra]
generator = false
